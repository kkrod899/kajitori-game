name: Publish the app to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the source of truth
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the app-only site
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js kajitori_minimal_pictogram_compact.html _site/
          cp kajitori_v03.css kajitori_v03_core.js kajitori_v03_actions.js kajitori_v03_ui.js _site/
          cp icons/icon.svg icons/icon-180.png icons/icon-192.png icons/icon-512.png _site/icons/

      - name: Upload the app-only artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
