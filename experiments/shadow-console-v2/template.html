<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4f718b">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none';">
<title>家事取り Shadow v2</title>
<style>__SHADOW_CSS__</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div><p class="eyebrow">本番想定・非依存テスト</p><h1>家事取り Shadow v2</h1><p id="headerStatus" class="sub"></p></div>
  <button id="settingsBtn" class="icon-btn" type="button" aria-label="家庭設定">設定</button>
</header>
<div class="safety-banner"><strong>判断には使わない。</strong> 健康・安全・期限対応は普段どおり行い、エンジンを待たないでください。</div>
<main id="main"></main>
<nav class="bottom-nav" aria-label="実証ナビ">
  <button data-view="today" class="active" type="button">今日</button>
  <button data-view="actual" type="button">実際に起きた</button>
  <button data-view="export" type="button">記録・出力</button>
</nav>
</div>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" type="button" aria-label="閉じる">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast" role="status"></div>
<script>window.__SHADOW_DATA__=__EMBEDDED_DATA__;</script>
<script>__SHADOW_JS__</script>
</body>
</html>
