<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家事取りゲーム Stable MVP</title>
  <meta name="theme-color" content="#7f926d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="家事取り" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <style>

    :root {
      --bg:#f7f4ef;
      --screen:#fbfaf7;
      --card:#fffdf9;
      --soft:#f6f1e8;
      --soft-2:#f2ece3;
      --line:#ebe3d8;
      --line-soft:#f2ebe2;
      --ink:#3d3832;
      --muted:#8f857a;
      --muted-light:#b2a89b;
      --sage:#7f926d;
      --sage-soft:#eef2e8;
      --beige:#f4eadc;
      --terracotta:#c98261;
      --terracotta-soft:#f8e9e0;
      --gold:#bb934f;
      --gold-soft:#f5edd9;
      --blue-soft:#edf2f2;
      --pink-soft:#f8ece7;
      --shadow:0 6px 18px rgba(70,58,44,.045);
      --font-text:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      --font-number:"Avenir Next","Helvetica Neue",Arial,sans-serif;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 16% 8%, rgba(190,178,158,.14), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(135,150,116,.10), transparent 32%),
        #f6f3ee;
      color:var(--ink);
      font-family:var(--font-text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .num {
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums lining-nums;
      letter-spacing:.01em;
    }

    .phone {
      width:390px;
      max-width:100%;
      height:844px;
      background:#141414;
      border-radius:42px;
      padding:12px;
      box-shadow:0 22px 64px rgba(40,32,24,.15);
    }

    .screen {
      height:100%;
      border-radius:32px;
      overflow:hidden;
      background:linear-gradient(180deg,#fcfbf8 0%, #f7f3ed 100%);
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .status {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 22px 6px;
      font-size:11px;
      font-weight:700;
      color:#3f3a34;
    }

    .header {
      padding:10px 24px 14px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    h1 {
      margin:0;
      font-size:19px;
      font-weight:600;
      letter-spacing:.12em;
      color:#3f3a34;
    }

    .subtitle {
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      letter-spacing:.02em;
    }

    .reset {
      width:34px;
      height:34px;
      border-radius:50%;
      border:1px solid var(--line-soft);
      background:rgba(255,255,255,.65);
      color:#8f867b;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 2px 8px rgba(70,58,44,.035);
    }

    main {
      flex:1;
      overflow:auto;
      padding:0 20px 92px;
    }

    .view { display:none; }
    .view.active { display:block; }

    .card {
      background:rgba(255,253,249,.78);
      border:1px solid var(--line-soft);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .hero {
      padding:18px 16px;
      margin-top:2px;
      border-radius:20px;
      background:rgba(255,253,249,.64);
    }

    .hero-grid {
      display:grid;
      grid-template-columns:118px 1fr;
      gap:18px;
      align-items:center;
    }

    .ring {
      width:108px;
      height:108px;
      border-radius:50%;
      background:conic-gradient(var(--sage) 0deg, #e8e1d6 0deg 360deg);
      display:grid;
      place-items:center;
      margin:0 auto;
      position:relative;
    }

    .ring:before {
      content:"";
      width:86px;
      height:86px;
      border-radius:50%;
      background:#fffdf9;
      border:1px solid #eee7dd;
      position:absolute;
    }

    .ring-inner {
      position:relative;
      z-index:1;
      text-align:center;
    }

    .ring-inner b {
      display:block;
      font-size:25px;
      line-height:1;
      font-weight:500;
      color:#3d3832;
    }

    .ring-inner span {
      display:block;
      margin-top:7px;
      color:var(--muted);
      font-size:10px;
      font-weight:600;
    }

    .xp-line {
      font-size:13px;
      font-weight:600;
      color:#524b43;
      line-height:1.5;
    }

    .xp-line b {
      font-size:15px;
      font-weight:600;
    }

    .bar {
      height:1px;
      background:#e9e1d6;
      border-radius:999px;
      overflow:visible;
      margin:9px 0 15px;
      position:relative;
    }

    .bar span {
      display:block;
      height:3px;
      width:0%;
      background:#a99779;
      border-radius:999px;
      position:relative;
      top:-1px;
    }

    .level {
      font-size:13px;
      font-weight:600;
      line-height:1.7;
      color:#4c463f;
    }

    .level small {
      display:block;
      color:var(--muted);
      font-size:11px;
      font-weight:600;
    }

    .stat-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:15px;
    }

    .stat {
      padding:10px 8px;
      background:#faf7f1;
      border:1px solid var(--line-soft);
      border-radius:15px;
      box-shadow:none;
    }

    .stat span {
      display:block;
      color:var(--muted);
      font-size:10px;
      font-weight:600;
      margin-bottom:6px;
    }

    .stat b {
      display:block;
      font-size:18px;
      line-height:1;
      font-weight:500;
      color:#49433c;
    }

    .tip {
      margin-top:15px;
      background:#f7f2ea;
      border:1px solid var(--line-soft);
      border-radius:15px;
      padding:12px 13px;
      font-size:12px;
      color:#7f766b;
      font-weight:600;
      line-height:1.65;
    }

    .chips {
      display:flex;
      gap:7px;
      overflow:auto;
      padding:2px 1px 5px;
      margin:17px 0 11px;
    }

    .chip {
      border:1px solid var(--line);
      background:rgba(255,255,255,.54);
      color:#8c8277;
      border-radius:999px;
      padding:8px 13px;
      font-size:11px;
      font-weight:600;
      white-space:nowrap;
      cursor:pointer;
      font-family:var(--font-text);
    }

    .chip.active {
      background:#f2ece3;
      border-color:#d9ccbd;
      color:#5f574e;
    }

    .section-title {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:20px 4px 10px;
      font-size:13px;
      font-weight:650;
      color:#4a443d;
      letter-spacing:.03em;
    }

    .badge {
      min-width:24px;
      height:24px;
      padding:0 8px;
      border-radius:999px;
      background:#f0eadf;
      border:1px solid var(--line);
      color:#8b8175;
      font-size:11px;
      font-weight:600;
      display:grid;
      place-items:center;
    }

    .list {
      display:grid;
      gap:10px;
    }

    .task {
      display:grid;
      grid-template-columns:42px 1fr;
      gap:13px;
      align-items:flex-start;
      padding:13px 13px;
      border-radius:16px;
      position:relative;
      overflow:hidden;
      background:rgba(255,253,249,.78);
    }

    .task.done {
      opacity:.55;
    }

    .task.missed {
      background:#fff8f4;
      border-color:#efd8cd;
    }

    .icon {
      width:42px;
      height:42px;
      border-radius:15px;
      background:linear-gradient(180deg,#fff,#f8f4ed);
      border:1px solid #ebe3d9;
      display:grid;
      place-items:center;
      font-size:21px;
      color:#857c70;
    }

    .task h3 {
      margin:0 0 5px;
      font-size:14px;
      line-height:1.35;
      padding-right:0;
      font-weight:650;
      letter-spacing:-.01em;
      color:#3f3a34;
    }

    .task p {
      margin:0;
      font-size:11px;
      color:var(--muted);
      font-weight:550;
      line-height:1.48;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .xp {
      position:static;
      display:inline-flex;
      width:max-content;
      margin-top:8px;
      color:#9a7d45;
      font-size:10px;
      font-weight:600;
      background:#f7f0df;
      border:1px solid #eadcc0;
      border-radius:999px;
      padding:4px 7px;
    }

    .meta {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:9px;
    }

    .pill {
      border-radius:999px;
      padding:4px 7px;
      font-size:10px;
      font-weight:600;
      background:#f4efe8;
      color:#81776c;
      border:1px solid #eadfd2;
      white-space:nowrap;
    }

    .pill.high {
      background:#d08362;
      color:#fff;
      border-color:#d08362;
    }

    .pill.middle {
      background:#c2a062;
      color:#fff;
      border-color:#c2a062;
    }

    .pill.low {
      background:var(--sage-soft);
      color:#6f7f5d;
      border-color:#dce8d5;
    }

    .pill.done {
      background:#eaf1e5;
      color:#637d4f;
      border-color:#d5e2cc;
    }

    .pill.missed {
      background:#f8e9e4;
      color:#a75d52;
      border-color:#eed0c7;
    }

    .actions {
      grid-column:2/3;
      display:flex;
      gap:8px;
      margin-top:11px;
    }

    .mini-btn {
      border:1px solid var(--line);
      background:#fffefa;
      color:#686056;
      border-radius:13px;
      padding:8px 10px;
      font-size:11px;
      font-weight:650;
      cursor:pointer;
      font-family:var(--font-text);
      flex:1;
      box-shadow:none;
    }

    .mini-btn.primary {
      background:#8f9d7a;
      border-color:#8f9d7a;
      color:#fff;
    }

    .mini-btn.miss {
      background:#fff8f4;
      border-color:#efd8cd;
      color:#a86656;
    }

    .mini-btn:disabled {
      opacity:.42;
      cursor:not-allowed;
    }

    .segmented {
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#f7f2ea;
      border:1px solid var(--line);
      border-radius:13px;
      padding:3px;
      margin-top:3px;
      margin-bottom:16px;
    }

    .segmented button {
      border:0;
      background:transparent;
      padding:9px 8px;
      border-radius:10px;
      font-size:12px;
      font-weight:600;
      color:var(--muted);
      cursor:pointer;
      font-family:var(--font-text);
    }

    .segmented button.active {
      background:#fffefa;
      color:#5a534b;
      box-shadow:0 1px 3px rgba(60,48,36,.04);
    }

    .category {
      display:grid;
      grid-template-columns:52px 1fr auto;
      gap:12px;
      align-items:center;
      padding:13px;
      border-radius:16px;
      background:rgba(255,253,249,.78);
    }

    .big-icon {
      width:52px;
      height:52px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:23px;
      border:1px solid var(--line-soft);
      background:#f2f4ed;
    }

    .category:nth-child(2n) .big-icon {
      background:#f5ebdc;
    }

    .category:nth-child(3n) .big-icon {
      background:#edf2f2;
    }

    .category:nth-child(4n) .big-icon {
      background:#f7eddf;
    }

    .category h3 {
      margin:0 0 5px;
      font-size:14px;
      font-weight:650;
      color:#403b34;
    }

    .category p {
      margin:0;
      font-size:11px;
      color:var(--muted);
      font-weight:550;
      line-height:1.48;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .count {
      font-size:13px;
      font-weight:600;
      color:#655e57;
    }

    .soft-box {
      padding:15px;
      background:#f7f2ea;
      border:1px solid var(--line-soft);
      border-radius:17px;
      margin-top:4px;
      margin-bottom:14px;
    }

    .soft-box h3 {
      margin:0 0 10px;
      font-size:16px;
      font-weight:650;
      color:#443f38;
    }

    .soft-box p {
      margin:0;
      color:var(--muted);
      font-size:12px;
      font-weight:550;
      line-height:1.65;
    }

    .empty {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      line-height:1.7;
      padding:24px 14px;
      border:1px dashed #d9cec0;
      border-radius:17px;
      background:#fbf8f3;
    }

    .bottom-nav {
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:10px 14px 18px;
      background:rgba(251,250,247,.96);
      backdrop-filter:blur(14px);
      border-top:1px solid var(--line-soft);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      z-index:20;
    }

    .tab {
      border:0;
      background:transparent;
      border-radius:14px;
      padding:8px 4px;
      color:#9b9287;
      cursor:pointer;
      display:grid;
      justify-items:center;
      gap:4px;
      font-size:10px;
      font-weight:650;
      font-family:var(--font-text);
      -webkit-tap-highlight-color: transparent;
    }

    .tab .ico {
      font-size:17px;
      line-height:1;
      opacity:.82;
    }

    .tab.active {
      color:#a9844d;
      background:transparent;
    }

    .toast {
      position:absolute;
      left:18px;
      right:18px;
      bottom:86px;
      background:#4f4840;
      color:#fff;
      padding:13px 14px;
      border-radius:16px;
      font-size:12px;
      font-weight:650;
      box-shadow:0 10px 30px rgba(70,58,44,.14);
      opacity:0;
      transform:translateY(10px);
      transition:.22s;
      pointer-events:none;
      z-index:30;
    }

    .toast.show {
      opacity:1;
      transform:translateY(0);
    }

    .pictogram {
      width:22px;
      height:22px;
      display:block;
      color:currentColor;
    }

    .pictogram * {
      vector-effect:non-scaling-stroke;
    }

    .icon,
    .big-icon {
      color:#7f766c;
    }

    .big-icon {
      color:#7d8970;
    }

    .category:nth-child(2n) .big-icon {
      color:#b38355;
    }

    .category:nth-child(3n) .big-icon {
      color:#7d949a;
    }

    .category:nth-child(4n) .big-icon {
      color:#a88749;
    }


    /* Compact task density adjustments */
    main {
      flex:1;
      overflow:auto;
      padding:0 18px 88px;
    }

    .hero {
      padding:14px 14px;
      margin-top:2px;
      border-radius:18px;
    }

    .hero-grid {
      grid-template-columns:94px 1fr;
      gap:14px;
    }

    .ring {
      width:88px;
      height:88px;
    }

    .ring:before {
      width:68px;
      height:68px;
    }

    .ring-inner b {
      font-size:20px;
    }

    .ring-inner span {
      margin-top:5px;
      font-size:9px;
    }

    .xp-line {
      font-size:11px;
    }

    .xp-line b {
      font-size:14px;
    }

    .bar {
      margin:7px 0 11px;
    }

    .level {
      font-size:12px;
      line-height:1.5;
    }

    .level small {
      font-size:10px;
    }

    .stat-grid {
      margin-top:12px;
      gap:6px;
    }

    .stat {
      padding:8px 7px;
      border-radius:13px;
    }

    .stat span {
      font-size:9px;
      margin-bottom:4px;
    }

    .stat b {
      font-size:16px;
    }

    .tip {
      margin-top:11px;
      padding:10px 11px;
      font-size:11px;
      line-height:1.45;
      border-radius:13px;
    }

    .chips {
      gap:6px;
      margin:12px 0 8px;
      padding-bottom:3px;
    }

    .chip {
      padding:7px 10px;
      font-size:10px;
    }

    .section-title {
      margin:14px 4px 8px;
      font-size:12px;
    }

    .badge {
      min-width:22px;
      height:22px;
      font-size:10px;
    }

    .list {
      gap:7px;
    }

    .task {
      grid-template-columns:34px 1fr;
      gap:10px;
      padding:10px 11px;
      border-radius:14px;
      align-items:center;
    }

    .icon {
      width:34px;
      height:34px;
      border-radius:12px;
      font-size:17px;
    }

    .pictogram {
      width:18px;
      height:18px;
    }

    .task h3 {
      margin:0;
      font-size:13px;
      line-height:1.28;
      font-weight:650;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .task p {
      margin:3px 0 0;
      font-size:10px;
      line-height:1.35;
      -webkit-line-clamp:1;
    }

    .meta {
      gap:5px;
      margin-top:7px;
    }

    .pill {
      padding:3px 6px;
      font-size:9px;
      line-height:1.1;
    }

    .xp {
      margin-top:0;
      margin-left:auto;
      flex-shrink:0;
      font-size:9px;
      padding:3px 6px;
      border-radius:999px;
      background:#f7f0df;
    }

    .actions {
      grid-column:2/3;
      gap:6px;
      margin-top:8px;
    }

    .mini-btn {
      padding:7px 8px;
      font-size:10px;
      border-radius:11px;
    }

    .category {
      grid-template-columns:42px 1fr auto;
      gap:10px;
      padding:10px 11px;
      border-radius:14px;
    }

    .big-icon {
      width:42px;
      height:42px;
      font-size:19px;
    }

    .category h3 {
      font-size:13px;
      margin-bottom:3px;
    }

    .category p {
      font-size:10px;
      line-height:1.35;
      -webkit-line-clamp:1;
    }

    .count {
      font-size:12px;
    }

    .soft-box {
      padding:12px 13px;
      border-radius:15px;
      margin-bottom:11px;
    }

    .soft-box h3 {
      font-size:15px;
      margin-bottom:7px;
    }

    .soft-box p {
      font-size:11px;
      line-height:1.5;
    }

    .segmented {
      margin-bottom:11px;
    }

    .segmented button {
      padding:8px 8px;
      font-size:11px;
    }

    .bottom-nav {
      padding:8px 14px 16px;
    }

    .tab {
      padding:7px 4px;
      font-size:9px;
    }

    .tab .ico {
      font-size:16px;
    }

    @media (max-width: 480px), (display-mode: standalone) {
      body {
        padding:0;
        align-items:stretch;
      }

      .phone {
        width:100%;
        max-width:none;
        height:100vh;
        min-height:100vh;
        padding:0;
        border-radius:0;
        box-shadow:none;
      }

      .screen {
        height:100%;
        border-radius:0;
      }
    }

    @supports (height: 100dvh) {
      @media (max-width: 480px), (display-mode: standalone) {
        .phone {
          height:100dvh;
          min-height:100dvh;
        }
      }
    }

  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status">
        <span class="num" id="clock">9:41</span>
        <span>家事取りゲーム</span>
        <span>●●●</span>
      </div>

      <div class="header">
        <div>
          <h1 id="pageTitle">今日</h1>
          <div class="subtitle" id="pageSub">今日の家事取り状況</div>
        </div>
        <button class="reset" onclick="resetApp()" title="リセット">↺</button>
      </div>

      <main>
        <section class="view active" id="homeView">
          <div class="card hero">
            <div class="hero-grid">
              <div class="ring" id="ring">
                <div class="ring-inner">
                  <b class="num" id="completionRate">0%</b>
                  <span>今日の達成率</span>
                </div>
              </div>
              <div>
                <div class="xp-line"><b class="num" id="todayXp">0</b> / <span class="num" id="todayTotalXp">0</span> XP</div>

  <script>
    // タブ切り替えは最優先。タスク処理が壊れてもここだけは動かす。
    function showView(name) {
      var titles = {
        home: ["今日", "今日の家事取り状況"],
        quests: ["クエスト", "育休特化タスク50個"],
        missed: ["取り逃がし", "明日のリトライ候補"],
        library: ["図鑑", "見えない家事の理解"]
      };

      var views = ["home", "quests", "missed", "library"];
      for (var i = 0; i < views.length; i++) {
        var view = document.getElementById(views[i] + "View");
        var tab = document.getElementById("tab-" + views[i]);
        if (view) view.className = view.className.replace(" active", "");
        if (tab) tab.className = tab.className.replace(" active", "");
      }

      var targetView = document.getElementById(name + "View");
      var targetTab = document.getElementById("tab-" + name);
      if (targetView && targetView.className.indexOf("active") === -1) targetView.className += " active";
      if (targetTab && targetTab.className.indexOf("active") === -1) targetTab.className += " active";

      document.getElementById("pageTitle").textContent = titles[name][0];
      document.getElementById("pageSub").textContent = titles[name][1];
    }

    function safeToast(message) {
      var el = document.getElementById("toast");
      if (!el) return;
      el.textContent = message;
      el.className = "toast show";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() {
        el.className = "toast";
      }, 1500);
    }
  </script>

    function todayKey() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function displayDate(dateString) {
      var d = new Date(dateString + "T00:00:00");
      var week = "日月火水木金土".charAt(d.getDay());
      return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + week + "）";
    }

    function updateClock() {
      var el = document.getElementById("clock");
      if (el) {
        el.textContent = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      }
    }

    function loadState() {
      var fallback = { tasksByDate: {}, missedLog: [], retryQueue: [] };
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return fallback;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch(e) {}
    }

    function isDue(task, dateString) {
      var d = new Date(dateString + "T00:00:00");
      var day = d.getDay();
      var rule = task.recurrence || { type:"daily" };
      if (rule.type === "daily") return true;
      if (rule.type === "weekday") return day >= 1 && day <= 5;
      if (rule.type === "weekly") return rule.daysOfWeek && rule.daysOfWeek.indexOf(day) !== -1;
      return true;
    }

    function ensureTodayTasks() {
      var date = todayKey();
      if (!state.tasksByDate[date]) state.tasksByDate[date] = [];

      var existing = {};
      for (var i = 0; i < state.tasksByDate[date].length; i++) {
        existing[state.tasksByDate[date][i].sourceId] = true;
      }

      for (var j = 0; j < SEED.tasks.length; j++) {
        var t = SEED.tasks[j];
        if (isDue(t, date) && !existing[t.id]) {
          var inst = JSON.parse(JSON.stringify(t));
          inst.id = date + "_" + t.id;
          inst.sourceId = t.id;
          inst.date = date;
          inst.status = "todo";
          state.tasksByDate[date].push(inst);
        }
      }

      saveState();
    }

    function todayTasks() {
      return state.tasksByDate[todayKey()] || [];
    }

    function stats() {
      var tasks = todayTasks();
      var totalXp = 0, doneXp = 0, done = 0, missed = 0, todo = 0;
      for (var i = 0; i < tasks.length; i++) {
        totalXp += tasks[i].xp;
        if (tasks[i].status === "done") { doneXp += tasks[i].xp; done++; }
        else if (tasks[i].status === "missed") { missed++; }
        else { todo++; }
      }
      return {
        totalXp: totalXp,
        doneXp: doneXp,
        rate: totalXp ? Math.round(doneXp / totalXp * 100) : 0,
        done: done,
        missed: missed,
        todo: todo
      };
    }

    function sortTasks(a, b) {
      var statusOrder = { todo:0, missed:1, done:2 };
      var priorityOrder = { high:0, middle:1, low:2 };
      return (statusOrder[a.status] - statusOrder[b.status]) ||
             (priorityOrder[a.priority] - priorityOrder[b.priority]) ||
             (b.xp - a.xp);
    }

    }

    function lifetimeXp() {
      var total = 0;
      var dates = Object.keys(state.tasksByDate);
      for (var i = 0; i < dates.length; i++) {
        var tasks = state.tasksByDate[dates[i]];
        for (var j = 0; j < tasks.length; j++) {
          if (tasks[j].status === "done") total += tasks[j].xp;
        }
      }
      return total;
    }

    function taskCard(task, actions) {
      var cat = categoryById(task.category);
      var div = document.createElement("div");
      div.className = "card task " + task.status;
      var status = task.status === "done" ? '<span class="pill done">完了</span>' :
                   task.status === "missed" ? '<span class="pill missed">取り逃がし</span>' : "";
      div.innerHTML =
        '<div class="icon">' + iconForCategory(task.category) + '</div>' +
        '<div>' +
          '<h3><span>' + htmlEscape(task.title) + '</span><span class="xp num">+' + task.xp + ' XP</span></h3>' +
          '<p>' + htmlEscape(task.description || task.successDefinition || "") + '</p>' +
          '<div class="meta">' +
            '<span class="pill">' + htmlEscape(task.categoryName) + '</span>' +
            '<span class="pill ' + task.priority + '">' + (priorityLabel[task.priority] || "") + '</span>' +
            '<span class="pill">' + (timingLabel[task.timing] || "随時") + '</span>' +
            status +
          '</div>' +
        '</div>';

      if (actions) {
        var action = document.createElement("div");
        action.className = "actions";
        var disabled = task.status !== "todo" ? "disabled" : "";
        action.innerHTML =
          '<button class="mini-btn primary" ' + disabled + '>完了</button>' +
          '<button class="mini-btn miss" ' + disabled + '>取り逃がし</button>';
        action.children[0].onclick = function() { completeTask(task.id); };
        action.children[1].onclick = function() { missTask(task.id); };
        div.appendChild(action);
      }

      return div;
    }

    function completeTask(id) {
      var tasks = todayTasks();
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].id === id && tasks[i].status === "todo") {
          tasks[i].status = "done";
          saveState();
          safeToast("完了：+" + tasks[i].xp + " XP");
          renderEverything();
          return;
        }
      }
    }

    function missTask(id) {
      var tasks = todayTasks();
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].id === id && tasks[i].status === "todo") {
          tasks[i].status = "missed";
          state.missedLog.unshift({
            id: "miss_" + Date.now(),
            date: todayKey(),
            converted: false,
            task: JSON.parse(JSON.stringify(tasks[i]))
          });
          saveState();
          safeToast("取り逃がし登録しました");
          renderEverything();
          return;
        }
      }
    }

    function retryMiss(id) {
      for (var i = 0; i < state.missedLog.length; i++) {
        if (state.missedLog[i].id === id && !state.missedLog[i].converted) {
          state.missedLog[i].converted = true;
          saveState();
          safeToast("明日のリトライに追加しました");
          renderMissedScreen();
          return;
        }
      }
    }

    function setQuestMode(mode) {
      questMode = mode;
      renderQuestScreen();
    }

    function renderQuestScreen() {
      document.getElementById("categoryButton").className = questMode === "category" ? "active" : "";
      document.getElementById("allButton").className = questMode === "all" ? "active" : "";
      document.getElementById("categoryList").style.display = questMode === "category" ? "grid" : "none";
      document.getElementById("allTaskList").style.display = questMode === "all" ? "grid" : "none";

      var catHost = document.getElementById("categoryList");
      catHost.innerHTML = "";
      for (var i = 0; i < SEED.categories.length; i++) {
        var cat = SEED.categories[i];
        var count = 0, invisible = 0;
        for (var j = 0; j < SEED.tasks.length; j++) {
          if (SEED.tasks[j].category === cat.id) {
            count++;
            if (SEED.tasks[j].isInvisibleTask) invisible++;
          }
        }
        var div = document.createElement("div");
        div.className = "card category";
        div.innerHTML =
          '<div class="big-icon">' + iconForCategory(cat.id) + '</div>' +
          '<div><h3>' + cat.name + '</h3><p>' + (guideDescriptions[cat.id] || "") + '<br>見えない家事：<span class="num">' + invisible + '</span>件</p></div>' +
          '<div class="count"><span class="num">' + count + '</span>件</div>';
        catHost.appendChild(div);
      }

      var allHost = document.getElementById("allTaskList");
      allHost.innerHTML = "";
      for (var k = 0; k < SEED.tasks.length; k++) {
        var mock = JSON.parse(JSON.stringify(SEED.tasks[k]));
        mock.id = "master_" + mock.id;
        mock.status = "todo";
        allHost.appendChild(taskCard(mock, false));
      }
    }

    function renderMissedScreen() {
      var host = document.getElementById("missedList");
      document.getElementById("missedLogCount").textContent = state.missedLog.length;
      host.innerHTML = "";
      if (!state.missedLog.length) {
        host.innerHTML = '<div class="empty">まだ取り逃がしはありません。<br>妻が先にやった家事に気づいたら「取り逃がし」で記録します。</div>';
        return;
      }

      for (var i = 0; i < state.missedLog.length; i++) {
        var miss = state.missedLog[i];
        var card = taskCard(miss.task, false);
        var action = document.createElement("div");
        action.className = "actions";
        action.innerHTML = '<button class="mini-btn primary" ' + (miss.converted ? "disabled" : "") + '>' + (miss.converted ? "追加済み" : "明日リトライ") + '</button>';
        action.children[0].setAttribute("data-id", miss.id);
        action.children[0].onclick = function() { retryMiss(this.getAttribute("data-id")); };
        card.appendChild(action);
        host.appendChild(card);
      }
    }

    function renderLibrary() {
      var host = document.getElementById("guideList");
      host.innerHTML = "";
      for (var i = 0; i < SEED.categories.length; i++) {
        var cat = SEED.categories[i];
        var count = 0;
        for (var j = 0; j < SEED.tasks.length; j++) {
          if (SEED.tasks[j].category === cat.id) count++;
        }
        var div = document.createElement("div");
        div.className = "card category";
        div.innerHTML =
          '<div class="big-icon">' + iconForCategory(cat.id) + '</div>' +
          '<div><h3>' + cat.name + '</h3><p>' + (guideDescriptions[cat.id] || "") + '<br>初期タスク：<span class="num">' + count + '</span>件</p></div>' +
          '<div class="count">›</div>';
        host.appendChild(div);
      }
    }

    function renderFallback() {
      document.getElementById("todayTaskList").innerHTML =
        '<div class="empty">初期化に失敗しました。<br>ただし下のタブ切り替えは動作確認できます。</div>';
    }

    function resetApp() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch(e) {}
      state = loadState();
      ensureTodayTasks();
      renderEverything();
      safeToast("リセットしました");
    }

    window.addEventListener("load", boot);
  </script>
  <script>
    (function registerOfflineShell() {
      if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function() {});
      });
    }());
  </script>
</body>
</html>
