<body>
  <div class="shell">
    <header><div class="head-row"><div class="brand">家事取りゲーム<small id="headerSubtitle">状態から次の一手を選ぶ v0.2</small></div><button class="icon-btn" type="button" onclick="openSettings()" aria-label="設定を開く">設定</button></div><div id="saveError" class="save-error" role="alert">保存できませんでした。端末の空き容量やブラウザ設定を確認してください。変更は保存されていません。</div></header>
    <main><section id="todayView" class="view active"></section><section id="forecastView" class="view"></section><section id="responsibleView" class="view"></section><section id="growthView" class="view"></section></main>
    <nav class="bottom-nav" aria-label="主要ナビゲーション"><button class="tab active" data-tab="today" onclick="switchTab('today')"><span class="tab-icon">◉</span>今日</button><button class="tab" data-tab="forecast" onclick="switchTab('forecast')"><span class="tab-icon">→</span>先読み</button><button class="tab" data-tab="responsible" onclick="switchTab('responsible')"><span class="tab-icon">↻</span>担当</button><button class="tab" data-tab="growth" onclick="switchTab('growth')"><span class="tab-icon">◇</span>成長</button></nav>
  </div>
  <div id="toast" class="toast" aria-live="polite"><span id="toastText"></span><button id="toastUndo" type="button" onclick="undoLast()">取り消す</button></div>
  <div id="swapOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="swapTitle"><div class="sheet"><h2 id="swapTitle">今日の枠はいっぱいです</h2><p id="swapText">追加するなら、今ある1件を「今日のあとで」へ移します。</p><div id="swapList" class="swap-list"></div><button class="btn ghost" style="width:100%;margin-top:10px" type="button" onclick="closeSwap()">追加しない</button></div></div>
  <div id="onboarding" class="onboarding" aria-live="polite"><div id="onboardingInner" class="onboarding-inner"></div></div>
  <script>
    'use strict';
    const STORAGE_KEY='kajitori_stable_mvp_v2',V02_VERSION=2,CAPACITY_LIMIT={protect:1,normal:2,ahead:3},CAPACITY_LABEL={protect:'守る日',normal:'回す日',ahead:'先回り日'},STATE_LABEL={enough:'十分',soon:'そろそろ',out:'切れた'};
    const QUESTION_AREAS=[{key:'night_set',label:'夜間セット'},{key:'diaper_stock',label:'オムツ在庫'}];
    const TEMPLATES=[
      {id:'tomorrow_plan',group:'schedule',priority:110,label:'明日の予定',action:'明日の予定を確認',minutes:5,fact:'明日の予定 今日未確認',reason:'前日に予定を持つと、朝の判断を減らせます。',close:'予定・持ち物・移動の不明点を閉じた',recurrence:'daily'},
      {id:'night_set',group:'newborn',priority:100,label:'夜間セット',stateKey:'night_set',stateLabel:'夜間セット',action:'夜間セットを確認・必要なら補充',minutes:8,reason:'寝る前にそろえておくと、夜中に探さずに済みます。',close:'オムツ、ガーゼ、着替えが一か所にそろった',recurrence:'daily',evidence:'inventory',evidenceText:'夜間セットを切らす前に補充できた'},
      {id:'daycare_bag',group:'daycare',priority:96,label:'次の登園セット',action:'次の登園セットを確認',minutes:8,fact:'次の登園セット 未確認',reason:'前日に差分を持つと、出発前の判断を減らせます。',close:'バッグ・着替え・必要物の差分を閉じた',recurrence:'daycareTomorrow',evidence:'deadline',evidenceText:'登園前に持ち物の準備を閉じた'},
      {id:'diaper_stock',group:'stock',priority:90,label:'オムツ在庫',stateKey:'diaper_stock',stateLabel:'オムツ在庫',action:'オムツ在庫を確認・必要なら補充',minutes:5,reason:'不足する前に状態を持つと、買い足し判断を前倒しできます。',close:'今日の状態を確認し、必要なら補充まで閉じた',recurrence:'daily',evidence:'inventory',evidenceText:'オムツ在庫を切らす前に補充できた'},
      {id:'meal_plan',group:'meal',priority:80,label:'夕食方針',action:'夕食の方針を決める',minutes:8,fact:'夕食方針 今日未決定',reason:'夕方に残る判断を、余力のある時間へ前倒しできます。',close:'作る・買う・残り物のどれにするか決めた',recurrence:'daily'},
      {id:'laundry_next',group:'housework',priority:74,label:'洗濯',action:'洗濯の次工程を確認して進める',minutes:12,fact:'洗濯 次工程未確認',reason:'途中で止まりやすい工程を、次の一手まで閉じます。',close:'洗う・干す・乾燥・戻すの次工程が止まっていない',recurrence:'daily'},
      {id:'rest_window',group:'care',priority:65,label:'休息枠',action:'家族の休息時間を1枠決める',minutes:5,fact:'休息枠 今日未設定',reason:'家事の件数ではなく、今日の余力を守るための時間も先に持ちます。',close:'中断されにくい時間帯を1つ決めた',recurrence:'daily'},
      {id:'older_ten',group:'older_child',priority:62,label:'上の子との10分',action:'上の子と2人だけの10分を作る',minutes:10,fact:'上の子との10分 今日未設定',reason:'下の子対応が続く日に、1対1で過ごす時間を確保します。',close:'10分だけ一緒に過ごした',recurrence:'olderChild'},
      {id:'next_size',group:'newborn',priority:54,label:'次サイズ',action:'オムツの次サイズを確認',minutes:5,fact:'次サイズ 今日未確認',reason:'月齢は断定ではなく、現在の様子を確認するきっかけにだけ使います。',close:'現在の様子を見て、買うか保留を決めた',recurrence:'weeklySunday'}
    ];
    const RESPONSIBLE_LOOPS=[['オムツ・消耗品','残量に気づく → 必要量を判断 → 調達 → 収納 → 次回確認'],['食事','方針決定 → 在庫確認 → 調達 → 準備 → 片付け'],['保育園','連絡確認 → 差分判断 → 準備 → 提出 → 補充'],['洗濯','回収 → 洗う → 乾かす → 畳む → 定位置へ戻す'],['予定','情報収集 → カレンダー反映 → 準備 → 当日対応 → 次回設定']];
    let rootState=loadRootState(),activeTab='today',lastUndo=null,toastTimer=null,saveFailed=false,pendingSwap=null,onboardingStep=1,onboardingDraft=null,editingProfile=false,questionExpanded=false;
    function deepClone(v){return JSON.parse(JSON.stringify(v))}function pad(n){return String(n).padStart(2,'0')}function dateKey(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dateFromKey(k){return new Date(k+'T12:00:00')}function addDays(k,n){const d=dateFromKey(k);d.setDate(d.getDate()+n);return dateKey(d)}function formatShortDate(k){if(!k)return'未確認';const d=dateFromKey(k);return(d.getMonth()+1)+'/'+d.getDate()}function today(){return dateKey(new Date())}function nowIso(){return new Date().toISOString()}function dayOfWeek(k){return dateFromKey(k).getDay()}function isWeekday(k){const d=dayOfWeek(k);return d>=1&&d<=5}function templateById(id){return TEMPLATES.find(t=>t.id===id)}
    function freshV02(){return{version:V02_VERSION,profile:{initialized:false,babyBirthdate:'',olderChild:false,daycare:false,feeding:'mixed',leaveEnd:'',rhythm:'all_day'},days:{},stateFacts:{},questionHistory:[],questionCooldownUntil:{},questionKnowStreak:{},evidenceEvents:[],spontaneous:[]}}function freshDay(){return{capacity:'normal',restOnly:false,planIds:[],status:{},currentId:null,questionKey:null,questionAnswered:false}}
    function loadRootState(){let root=null;try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object'&&!Array.isArray(p))root=p}}catch(e){}if(!root)root={tasksByDate:{},missedLog:[],retryQueue:[]};if(!root.v02||root.v02.version!==V02_VERSION)root.v02=freshV02();normalizeV02(root.v02);return root}
    function normalizeV02(v){const b=freshV02();v.profile=Object.assign(b.profile,v.profile||{});v.days=v.days||{};v.stateFacts=v.stateFacts||{};v.questionHistory=Array.isArray(v.questionHistory)?v.questionHistory:[];v.questionCooldownUntil=v.questionCooldownUntil||{};v.questionKnowStreak=v.questionKnowStreak||{};v.evidenceEvents=Array.isArray(v.evidenceEvents)?v.evidenceEvents:[];v.spontaneous=Array.isArray(v.spontaneous)?v.spontaneous:[]}
    function saveRootState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(rootState));saveFailed=false;document.getElementById('saveError')?.classList.remove('show');return true}catch(e){saveFailed=true;document.getElementById('saveError')?.classList.add('show');return false}}
    function mutate(label,fn,undoable=true){const before=deepClone(rootState.v02);fn();if(!saveRootState()){rootState.v02=before;renderAll();document.getElementById('saveError')?.classList.add('show');return false}if(undoable)lastUndo={label,before};renderAll();showToast(label,undoable);return true}
    function undoLast(){if(!lastUndo)return;const current=deepClone(rootState.v02);rootState.v02=lastUndo.before;if(!saveRootState()){rootState.v02=current;renderAll();document.getElementById('saveError')?.classList.add('show');return}const label=lastUndo.label;lastUndo=null;renderAll();showToast(label+'を取り消しました',false)}
    function showToast(text,withUndo=false){const toast=document.getElementById('toast');document.getElementById('toastText').textContent=text;document.getElementById('toastUndo').style.display=withUndo?'block':'none';toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),withUndo?5500:2800)}
    function ensureTodayDay(){const v=rootState.v02,key=today();if(!v.days[key])v.days[key]=freshDay();const d=v.days[key];d.planIds=Array.isArray(d.planIds)?d.planIds:[];d.status=d.status||{};if(!d.capacity||!CAPACITY_LIMIT[d.capacity])d.capacity='normal';if(typeof d.restOnly!=='boolean')d.restOnly=false;if(v.profile.initialized){if(!d.questionKey&&!d.questionAnswered)d.questionKey=pickQuestionKey(key);ensurePlanForCapacity(d,key);enforceCapacity(d)}return d}
    function capacityLimit(d){return d.restOnly?0:CAPACITY_LIMIT[d.capacity]}function activeIds(d){return d.planIds.filter(id=>d.status[id]==='active')}function activeCount(d){return activeIds(d).length}
    function templateEligible(t,key=today()){const p=rootState.v02.profile;if(t.recurrence==='daily')return true;if(t.recurrence==='olderChild')return!!p.olderChild;if(t.recurrence==='daycareTomorrow')return!!p.daycare&&isWeekday(addDays(key,1));if(t.recurrence==='weeklySunday')return dayOfWeek(key)===0;return true}
    function candidateScore(t,d){const g=d.planIds.map(id=>templateById(id)?.group).filter(Boolean);return t.priority-(g.includes(t.group)?18:0)}function nextCandidate(d,key=today()){return TEMPLATES.filter(t=>templateEligible(t,key)&&!d.planIds.includes(t.id)).sort((a,b)=>candidateScore(b,d)-candidateScore(a,d))[0]||null}

    function openSettings(){editingProfile=true;onboardingStep=1;onboardingDraft=deepClone(rootState.v02.profile);renderOnboarding()}function startOnboarding(){editingProfile=false;onboardingStep=1;onboardingDraft=deepClone(rootState.v02.profile);renderOnboarding()}
    function renderOnboarding(){const overlay=document.getElementById('onboarding'),host=document.getElementById('onboardingInner'),d=onboardingDraft||deepClone(rootState.v02.profile);overlay.classList.add('show');if(onboardingStep===1)host.innerHTML='<div class="progress">1 / 3</div><h1>赤ちゃんの時期を設定</h1><p class="lead">月齢は提案のきっかけにだけ使います。分からなければ空欄で進められます。</p><div class="field"><label for="babyBirthdate">誕生日</label><input id="babyBirthdate" type="date" max="'+today()+'" value="'+escapeHtml(d.babyBirthdate)+'"></div><div class="onboarding-actions '+(editingProfile?'':'single')+'">'+(editingProfile?'<button class="btn" type="button" onclick="closeOnboarding()">閉じる</button>':'')+'<button class="btn primary" type="button" onclick="nextOnboarding1()">次へ</button></div>';else if(onboardingStep===2)host.innerHTML='<div class="progress">2 / 3</div><h1>当てはまるものだけ</h1><p class="lead">該当しない家庭へ、上の子・保育園の候補を出さないための設定です。</p><label class="toggle-row"><span><strong>上の子がいる</strong><br><small class="muted">上の子向け候補を有効化</small></span><input id="olderChild" type="checkbox" '+(d.olderChild?'checked':'')+'></label><label class="toggle-row"><span><strong>保育園を利用</strong><br><small class="muted">登園準備の先読みを有効化</small></span><input id="daycare" type="checkbox" '+(d.daycare?'checked':'')+'></label><div class="field" style="margin-top:18px"><label for="feeding">授乳方法</label><select id="feeding"><option value="mixed" '+(d.feeding==='mixed'?'selected':'')+'>混合・未固定</option><option value="formula" '+(d.feeding==='formula'?'selected':'')+'>ミルク中心</option><option value="breast" '+(d.feeding==='breast'?'selected':'')+'>母乳中心</option><option value="other" '+(d.feeding==='other'?'selected':'')+'>その他 / 後で</option></select></div><div class="onboarding-actions"><button class="btn" type="button" onclick="backOnboarding()">戻る</button><button class="btn primary" type="button" onclick="nextOnboarding2()">次へ</button></div>';else host.innerHTML='<div class="progress">3 / 3</div><h1>生活の枠だけ設定</h1><p class="lead">通知設定や担当認定はここでは求めません。</p><div class="field"><label for="leaveEnd">育休終了予定（任意）</label><input id="leaveEnd" type="date" value="'+escapeHtml(d.leaveEnd)+'"></div><div class="field"><label for="rhythm">日中の使い方</label><select id="rhythm"><option value="all_day" '+(d.rhythm==='all_day'?'selected':'')+'>日中も家庭運営を担う</option><option value="split" '+(d.rhythm==='split'?'selected':'')+'>時間帯を分けて使う</option><option value="later" '+(d.rhythm==='later'?'selected':'')+'>後で調整する</option></select></div><div class="onboarding-actions"><button class="btn" type="button" onclick="backOnboarding()">戻る</button><button class="btn primary" type="button" onclick="finishOnboarding()">今日へ進む</button></div>'+(editingProfile?'<div class="settings-actions"><button class="btn warn" style="width:100%" type="button" onclick="resetV02()">v0.2の記録だけ初期化</button><p class="muted" style="font-size:12px;line-height:1.6">旧版のtasksByDate / missedLog / retryQueueは削除しません。</p></div>':'')}
    function nextOnboarding1(){onboardingDraft.babyBirthdate=document.getElementById('babyBirthdate').value||'';onboardingStep=2;renderOnboarding()}function nextOnboarding2(){onboardingDraft.olderChild=document.getElementById('olderChild').checked;onboardingDraft.daycare=document.getElementById('daycare').checked;onboardingDraft.feeding=document.getElementById('feeding').value;onboardingStep=3;renderOnboarding()}function backOnboarding(){onboardingStep=Math.max(1,onboardingStep-1);renderOnboarding()}function closeOnboarding(){document.getElementById('onboarding').classList.remove('show');editingProfile=false}
    function finishOnboarding(){onboardingDraft.leaveEnd=document.getElementById('leaveEnd').value||'';onboardingDraft.rhythm=document.getElementById('rhythm').value;onboardingDraft.initialized=true;const was=rootState.v02.profile.initialized;mutate(was?'設定を更新しました':'初回設定を保存しました',()=>{rootState.v02.profile=deepClone(onboardingDraft);const d=ensureTodayDay();if(!was&&d.planIds.length===0)ensurePlanForCapacity(d)},false);if(rootState.v02.profile.initialized){document.getElementById('onboarding').classList.remove('show');editingProfile=false;activeTab='today';renderAll()}}
    function resetV02(){if(!confirm('v0.2の設定と記録だけを初期化します。旧版の保存データは残します。'))return;const prev=deepClone(rootState.v02);rootState.v02=freshV02();if(!saveRootState()){rootState.v02=prev;renderAll();document.getElementById('saveError').classList.add('show');return}lastUndo=null;closeOnboarding();startOnboarding();showToast('v0.2だけ初期化しました',false)}
    function boot(){normalizeV02(rootState.v02);if(!saveRootState())document.getElementById('saveError').classList.add('show');if(!rootState.v02.profile.initialized)startOnboarding();else{ensureTodayDay();saveRootState();renderAll()}}boot();
    if('serviceWorker' in navigator && window.isSecureContext){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}))}
  </script>
</body>
